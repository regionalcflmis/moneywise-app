<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b5cab">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MoneyWise CFL">
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="./manifest.webmanifest?v=5531">
  <title>MoneyWise CFL Monitoring</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#eef3f8;color:#16324f}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{max-width:520px;background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.10);text-align:center}
    .spinner{width:38px;height:38px;border:4px solid #d9e6f2;border-top-color:#0b5cab;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    a{display:inline-block;margin-top:14px;background:#0b5cab;color:#fff;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:700}
    .small{font-size:13px;color:#60758a;margin-top:10px}
  </style>
</head>
<body>
  <div class="wrap"><div class="card">
    <div class="spinner"></div>
    <h2>Opening MoneyWise CFL Monitoring</h2>
    <div class="small">PWA v5.5.3 — clearing old GitHub dashboard cache…</div>
    <a id="open" href="https://script.google.com/macros/s/AKfycbyWeFRIbiQx5iWkCRR6BJiRtzA4Wp4HNTVVaQzntacWv9YU1DHnaqxvlGns6LPtZk4K/exec">Open MoneyWise App</a>
  </div></div>
<script>
(async function(){
  const target="https://script.google.com/macros/s/AKfycbyWeFRIbiQx5iWkCRR6BJiRtzA4Wp4HNTVVaQzntacWv9YU1DHnaqxvlGns6LPtZk4K/exec" + (? + "_pwa=5531&_ts=" + Date.now());
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  // Do not iframe. Force the browser onto the current Apps Script deployment.
  location.replace(target);
})();
</script>
</body>
</html>
