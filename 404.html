<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b5cab">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MoneyWise CFL">
  <meta name="application-name" content="MoneyWise CFL Monitoring">
  <link rel="manifest" href="./manifest.webmanifest?v=5751">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=5751">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png?v=5751">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=5751">
  <title>MoneyWise CFL Monitoring</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#eef3f8;color:#15324a}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:22px}
    .card{width:min(560px,100%);background:#fff;border-radius:20px;padding:30px;box-shadow:0 12px 38px rgba(24,62,92,.14);text-align:center}
    .logo{width:88px;height:88px;border-radius:20px;margin:0 auto 16px;display:block}
    h1{font-size:28px;margin:8px 0 8px;color:#0b3f68}
    .muted{color:#60758a;line-height:1.5}
    .version{font-size:13px;color:#7a8c9d;margin:8px 0 18px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
    button,a.btn{appearance:none;border:0;border-radius:11px;padding:13px 18px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}
    .primary{background:#0b5cab;color:#fff}
    .success{background:#18864b;color:#fff}
    .outline{background:#fff;color:#0b5cab;border:1px solid #8eb9df}
    #installBtn{display:none}
    .note{margin-top:18px;padding:12px 14px;border-radius:12px;background:#f4f8fc;font-size:13px;color:#52697e;text-align:left}
    .ok{color:#13753d;font-weight:700}
  </style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <img class="logo" src="./icon-192.png?v=5751" alt="MoneyWise">
    <h1>MoneyWise CFL Monitoring</h1>
    <div class="muted">Install the MoneyWise app, or open the Monitoring Login in your browser.</div>
    <div class="version">PWA v5.7.5</div>

    <div class="actions">
      <button id="installBtn" class="success">Install MoneyWise App</button>
      <a class="btn primary" href="https://script.google.com/macros/s/AKfycbwcYHem2VbmiWqkZy2961tjbO1rscVpOkPxkYo521BVO86KJnNWg4vGjLJf6mYxXbTf/exec?pwa=5751">Open Monitoring Login</a>
    </div>

    <div id="status" class="note">
      If the Install button is not visible yet, wait a few seconds. Chrome shows it only after the PWA installability check completes.
    </div>
  </main>
</div>

<script>
let deferredInstallPrompt=null;
const installBtn=document.getElementById('installBtn');
const statusBox=document.getElementById('status');

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
}

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  installBtn.style.display='inline-block';
  statusBox.innerHTML='<span class="ok">App is ready to install.</span> Click “Install MoneyWise App”.';
});

window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  installBtn.style.display='none';
  statusBox.innerHTML='<span class="ok">MoneyWise App installed successfully.</span> You can now open it from your desktop/home screen.';
});

installBtn.addEventListener('click',async()=>{
  if(!deferredInstallPrompt){
    statusBox.textContent='Install prompt is not available yet. Use Chrome menu → Install app / Add to Home screen.';
    return;
  }
  deferredInstallPrompt.prompt();
  try{
    const choice=await deferredInstallPrompt.userChoice;
    if(choice&&choice.outcome==='accepted'){
      statusBox.innerHTML='<span class="ok">Installation accepted.</span>';
    } else {
      statusBox.textContent='Installation was cancelled.';
    }
  }catch(e){}
  deferredInstallPrompt=null;
});

if('serviceWorker' in navigator){
  window.addEventListener('load',async()=>{
    try{
      await navigator.serviceWorker.register('./sw.js?v=5751',{scope:'./'});
      statusBox.dataset.sw='ready';
    }catch(e){
      statusBox.textContent='Service worker registration failed. Refresh once and try again.';
    }
  });
}

// When launched as an installed PWA, go straight to Monitoring Login.
if(isStandalone()){
  statusBox.textContent='Installed app detected. Opening Monitoring Login…';
  setTimeout(()=>location.replace("https://script.google.com/macros/s/AKfycbwcYHem2VbmiWqkZy2961tjbO1rscVpOkPxkYo521BVO86KJnNWg4vGjLJf6mYxXbTf/exec"+'?pwa=5751&standalone=1'),350);
}
</script>
</body>
</html>
