<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b5cab">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MoneyWise CFL">
  <meta name="description" content="MoneyWise CFL Monitoring portal progressive web app.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>MoneyWise CFL Monitoring</title>
  <script src="./config.js"></script>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18324d;background:#eef3f8}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{display:flex;flex-direction:column;background:#eef3f8}
    .bar{min-height:54px;display:flex;align-items:center;gap:10px;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:#fff;border-bottom:1px solid #dce5ee;box-shadow:0 1px 8px rgba(25,52,79,.08);z-index:5}
    .brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
    .mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#0b5cab;color:#fff;font-weight:800;font-size:12px;letter-spacing:.3px;flex:none}
    .brandtext{min-width:0}
    .title{font-size:14px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sub{font-size:10.5px;color:#667b90;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .actions{display:flex;gap:6px;align-items:center;flex:none}
    button,a.btn{appearance:none;border:1px solid #cfdbe7;background:#fff;color:#16426c;border-radius:9px;padding:8px 10px;font:700 12px/1 system-ui;text-decoration:none;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;justify-content:center}
    button.primary,a.btn.primary{background:#0b5cab;border-color:#0b5cab;color:#fff}
    button[hidden]{display:none!important}
    .framewrap{position:relative;flex:1;min-height:0;background:#fff}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .loading{position:absolute;inset:0;display:grid;place-items:center;background:#f4f7fb;z-index:2;transition:opacity .2s ease}
    .loading.done{opacity:0;pointer-events:none}
    .loadcard{max-width:340px;margin:18px;padding:20px;text-align:center;background:#fff;border:1px solid #dce5ee;border-radius:14px;box-shadow:0 8px 28px rgba(25,52,79,.08)}
    .spinner{width:30px;height:30px;margin:0 auto 12px;border:3px solid #dbe7f1;border-top-color:#0b5cab;border-radius:50%;animation:spin .8s linear infinite}
    .offline{position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:4;padding:10px 12px;border-radius:10px;background:#fff7e6;border:1px solid #f1d59c;color:#6e4c0c;font-size:12px;font-weight:700;display:none}
    .offline.show{display:block}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:640px){.sub{display:none}.bar{min-height:50px}.mark{width:32px;height:32px}.actions button,.actions a.btn{padding:7px 8px;font-size:11px}.hide-small{display:none!important}}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none}.loading{transition:none}}
  </style>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <div class="mark">MW</div>
      <div class="brandtext">
        <div class="title">MoneyWise CFL Monitoring</div>
        <div class="sub" id="versionText">PWA Shell</div>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="installBtn" class="primary" hidden>Install</button>
      <button type="button" id="reloadBtn" class="hide-small">Reload</button>
      <a id="openBtn" class="btn" target="_blank" rel="noopener">Full screen</a>
    </div>
  </header>
  <main class="framewrap">
    <div class="loading" id="loading">
      <div class="loadcard"><div class="spinner" aria-hidden="true"></div><strong>Opening MoneyWise CFL Monitoring…</strong><div style="font-size:12px;color:#6b7f91;margin-top:7px">Live Apps Script deployment</div></div>
    </div>
    <iframe id="appFrame" title="MoneyWise CFL Monitoring application" allow="camera; microphone; geolocation; clipboard-read; clipboard-write"></iframe>
    <div class="offline" id="offlineNote" role="status">Internet connection is unavailable. Reconnect to open the live monitoring portal.</div>
  </main>
  <script>
    (function(){
      'use strict';
      const cfg=window.MONEYWISE_PWA_CONFIG||{};
      const base=String(cfg.appUrl||'').trim();
      const frame=document.getElementById('appFrame');
      const loading=document.getElementById('loading');
      const openBtn=document.getElementById('openBtn');
      const reloadBtn=document.getElementById('reloadBtn');
      const installBtn=document.getElementById('installBtn');
      const offlineNote=document.getElementById('offlineNote');
      document.getElementById('versionText').textContent='PWA '+(cfg.shellVersion||'live')+' • same /exec URL = automatic app updates';
      if(!/^https:\/\/script\.google\.com\/macros\/s\//.test(base)){
        loading.innerHTML='<div class="loadcard"><strong>PWA configuration error</strong><div style="font-size:12px;margin-top:8px">Set a valid Apps Script /exec URL in config.js.</div></div>';
        return;
      }
      function liveUrl(){
        const u=new URL(base);
        const q=new URLSearchParams(location.search);
        q.delete('pwa');
        q.forEach((v,k)=>u.searchParams.append(k,v));
        if(location.hash)u.hash=location.hash;
        return u.toString();
      }
      function showNetwork(){offlineNote.classList.toggle('show',!navigator.onLine)}
      const target=liveUrl();
      openBtn.href=target;
      frame.src=target;
      frame.addEventListener('load',()=>loading.classList.add('done'),{once:true});
      setTimeout(()=>loading.classList.add('done'),9000);
      reloadBtn.addEventListener('click',()=>{loading.classList.remove('done');frame.src=liveUrl();setTimeout(()=>loading.classList.add('done'),9000)});
      window.addEventListener('online',showNetwork);
      window.addEventListener('offline',showNetwork);
      showNetwork();
      let deferredPrompt=null;
      window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;installBtn.hidden=false});
      installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;installBtn.hidden=true});
      window.addEventListener('appinstalled',()=>{installBtn.hidden=true;deferredPrompt=null});
      if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
    })();
  </script>
</body>
</html>
