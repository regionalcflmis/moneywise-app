<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b5cab">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MoneyWise CFL">
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="./manifest.webmanifest?v=5721">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=5721">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=5721">
  <meta http-equiv="refresh" content="0;url=https://script.google.com/macros/s/AKfycbwcYHem2VbmiWqkZy2961tjbO1rscVpOkPxkYo521BVO86KJnNWg4vGjLJf6mYxXbTf/exec?pwa=5721">
  <title>MoneyWise CFL Monitoring</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#eef3f8;color:#16324f}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{max-width:520px;background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.10);text-align:center}
    .spinner{width:38px;height:38px;border:4px solid #d9e6f2;border-top-color:#0b5cab;border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    a{display:inline-block;margin-top:14px;background:#0b5cab;color:#fff;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:700}
    .small{font-size:13px;color:#60758a;margin-top:10px}
  </style>
</head>
<body>
  <div class="wrap"><div class="card">
    <div class="spinner"></div>
    <h2>Opening MoneyWise CFL Monitoring</h2>
    <div class="small">PWA v5.7.2 — opening current app…</div>
    <a href="https://script.google.com/macros/s/AKfycbyWeFRIbiQx5iWkCRR6BJiRtzA4Wp4HNTVVaQzntacWv9YU1DHnaqxvlGns6LPtZk4K/exec?pwa=5721">Open MoneyWise App</a>
  </div></div>
<script>
(function(){
  const target="https://script.google.com/macros/s/AKfycbyWeFRIbiQx5iWkCRR6BJiRtzA4Wp4HNTVVaQzntacWv9YU1DHnaqxvlGns6LPtZk4K/exec?pwa=5721"+'&t='+Date.now();
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs=>regs.forEach(r=>r.unregister())).catch(()=>{});
    }
    if (window.caches) {
      caches.keys().then(keys=>keys.forEach(k=>caches.delete(k))).catch(()=>{});
    }
  } catch(e) {}
  window.location.replace(target);
})();
</script>
</body>
</html>
